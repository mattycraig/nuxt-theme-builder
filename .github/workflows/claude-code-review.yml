name: Claude Code Review

# Automatic PR review by Claude Code using the repo's own review checklist
# (.claude/agents/code-reviewer.md). Skips drafts, forks, and Dependabot, and
# stays green (skipped with a notice) until CLAUDE_CODE_OAUTH_TOKEN is configured.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Claude credentials
        id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not configured; skipping Claude review."
          fi

      - uses: actions/checkout@v4
        if: steps.auth.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the Nuxt UI Theme Builder.

            1. Read CLAUDE.md, then .claude/agents/code-reviewer.md, and follow that
               checklist and its "verify before reporting" rule. Read the
               .claude/rules/*.md files whose `paths` match the changed files.
            2. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            3. Post each verified defect as an inline comment on the exact line, with a
               concrete failure scenario and a suggested fix.
            4. Post one short top-level summary with `gh pr comment`: blocking issues,
               non-blocking suggestions, and missing tests/docs. If nothing is wrong,
               say so in one line.

            Don't comment on formatting the linters already enforce, and don't approve
            or request changes.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
