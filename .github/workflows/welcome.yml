name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  # actions/first-interaction@v3 is not used: it welcomes any PR author who has
  # never opened an *issue* (its PR check doesn't filter by author at all), so
  # the maintainer and bots got a "first pull request" comment on every PR.
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          ISSUE_MESSAGE: |
            👋 Welcome to Nuxt UI Theme Builder!

            Thank you for opening your first issue. We appreciate you taking the time to report this.

            **What happens next:**
            - A maintainer will review your issue soon
            - Please watch for follow-up questions
            - Check out our [Contributing Guide](https://github.com/mattycraig/nuxt-theme-builder/blob/master/CONTRIBUTING.md)
          PR_MESSAGE: |
            👋 Welcome to Nuxt UI Theme Builder!

            Thank you for your first pull request! We're excited to review your contribution.

            **Checklist reminder:**
            - [ ] Tests pass locally (`pnpm test`)
            - [ ] Linting passes (`pnpm lint`)
            - [ ] TypeScript compiles (`pnpm typecheck`)
            - [ ] PR description explains the change

            A maintainer will review your PR soon. Thanks for contributing! 🎉
        with:
          script: |
            const isPullRequest = context.eventName === "pull_request_target";
            const item = isPullRequest ? context.payload.pull_request : context.payload.issue;
            const author = item.user;

            if (author.type === "Bot") {
              core.info(`Skipping: ${author.login} is a bot`);
              return;
            }
            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(item.author_association)) {
              core.info(`Skipping: ${author.login} is ${item.author_association}`);
              return;
            }

            // listForRepo returns both issues and PRs, so one query covers either
            // event; keep only earlier items of the same kind by the same author.
            const previous = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              creator: author.login,
              state: "all",
              per_page: 100,
            });
            const hasEarlier = previous.some(
              (other) => other.number < item.number && Boolean(other.pull_request) === isPullRequest,
            );
            if (hasEarlier) {
              core.info(`Skipping: not ${author.login}'s first ${isPullRequest ? "pull request" : "issue"}`);
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: item.number,
              body: isPullRequest ? process.env.PR_MESSAGE : process.env.ISSUE_MESSAGE,
            });
