name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  # first-interaction v3 requires both messages on every run and posts the one
  # that matches the event, so a single job handles issues and PRs.
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            👋 Welcome to Nuxt UI Theme Builder!

            Thank you for opening your first issue. We appreciate you taking the time to report this.

            **What happens next:**
            - A maintainer will review your issue soon
            - Please watch for follow-up questions
            - Check out our [Contributing Guide](https://github.com/mattycraig/nuxt-theme-builder/blob/master/CONTRIBUTING.md)
          pr_message: |
            👋 Welcome to Nuxt UI Theme Builder!

            Thank you for your first pull request! We're excited to review your contribution.

            **Checklist reminder:**
            - [ ] Tests pass locally (`pnpm test`)
            - [ ] Linting passes (`pnpm lint`)
            - [ ] TypeScript compiles (`pnpm typecheck`)
            - [ ] PR description explains the change

            A maintainer will review your PR soon. Thanks for contributing! 🎉
